<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Appointment Booking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="booking-container">
<h1>Appointment Booking</h1>
<!-- Calendar -->
<section class="calendar">
<div class="calendar-header">
<button id="previousMonth" class="nav-button">
‹
</button>
<h2 id="monthYear"></h2>
<button id="nextMonth" class="nav-button">
›
</button>
</div>
<div class="weekdays">
<div>Mon</div>
<div>Tue</div>
<div>Wed</div>
<div>Thu</div>
<div>Fri</div>
<div>Sat</div>
<div>Sun</div>
</div>
<div id="calendarDays" class="calendar-days"></div>
</section>
<!-- Appointment slots -->
<section id="appointmentsSection"
class="appointments-section hidden">
<h2 id="selectedDate"></h2>
<p class="instruction">
Select an available appointment time.
</p>
<div id="appointmentSlots"
class="appointment-slots">
</div>
</section>
<!-- Booking form -->
<section id="bookingSection"
class="booking-form hidden">
<h2>Book Appointment</h2>
<p>
<strong>Date:</strong>
<span id="bookingDate"></span>
</p>
<p>
<strong>Time:</strong>
<span id="bookingTime"></span>
</p>
<label for="name">
Name
</label>
<input
type="text"
id="name"
placeholder="Enter your name"
>
<label for="email">
Email
</label>
<input
type="email"
id="email"
placeholder="Enter your email"
>
<div class="form-buttons">
<button id="confirmBooking"
class="primary-button">
Confirm Booking
</button>
<button id="cancelBooking"
class="secondary-button">
Cancel
</button>
</div>
<p id="bookingMessage"
class="booking-message">
</p>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
